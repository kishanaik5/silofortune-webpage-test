<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job | Silo Fortune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/silo_logo.png" alt="Silo Fortune Logo"
                    style="height: 50px; width: auto; object-fit: contain;">
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="open-positions.html" class="nav-link">Back to Careers</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header">
        <div class="page-header-content">
            <h1 class="page-title">Job Application</h1>
            <p class="page-description">Join us in revolutionizing dairy farming.</p>
        </div>
    </header>

    <section style="background: var(--color-light); padding: 4rem 1rem;">
        <div class="contact-form-container"
            style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: var(--shadow-md);">
            <form id="applicationForm" class="contact-form" onsubmit="submitApplication(event)"
                style="box-shadow: none; padding: 0;">
                <h3 style="margin-bottom: 1.5rem; color: var(--color-primary); text-align: center;">Submit Your
                    Application</h3>

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" name="phone" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">LinkedIn Profile (Optional)</label>
                    <input type="url" name="linkedin_url" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Position (Job ID)</label>
                    <input type="text" name="job_id" id="jobIdInput" class="form-input" placeholder="Job ID" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Resume (PDF only)</label>
                    <input type="file" name="resume" class="form-input" accept=".pdf" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Application</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <p class="footer-copyright" style="text-align: center;">© 2026 Silo Fortune Pvt Ltd.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
